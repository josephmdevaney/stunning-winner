[project]
name = "repeatscope"
version = "0.1.0"
description = "Annotate PacBio TRGT repeat-expansion VCFs against the STRchive disease-locus catalog"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
repeatscope = "repeatscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repeatscope*", "mitolr*", "paraphase_annotate*", "kivvi*", "roh*", "pacbio_tools*"]

[tool.setuptools.package-data]
pacbio_tools = ["releases_snapshot.json"]
