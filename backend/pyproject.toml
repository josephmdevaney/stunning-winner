[project]
name = "repeatscope"
version = "0.1.0"
description = "Annotate PacBio TRGT repeat-expansion VCFs against the STRchive disease-locus catalog"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
repeatscope = "repeatscope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repeatscope*"]
