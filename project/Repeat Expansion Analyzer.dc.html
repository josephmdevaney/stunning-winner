<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <script src="strchive-data.js"></script>
  <style>
    body { margin: 0; background: oklch(0.97 0.005 90); }
    * { box-sizing: border-box; font-family: 'IBM Plex Sans', Helvetica, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: oklch(0.85 0.01 90); border-radius: 4px; }
  </style>
</helmet>

<div style="display:flex; width:100%; min-height:100vh; background:oklch(0.97 0.005 90); color:oklch(0.22 0.02 260);">

  <!-- SIDEBAR -->
  <div style="width:232px; flex-shrink:0; background:oklch(0.22 0.04 260); display:flex; flex-direction:column; padding:20px 14px; gap:4px;">
    <div style="display:flex; align-items:center; gap:10px; padding:8px 8px 20px 8px;">
      <svg width="28" height="28" viewBox="0 0 32 32"><polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="none" stroke="oklch(0.78 0.13 220)" stroke-width="2.5"></polygon><polygon points="16,10 22,13.5 22,20.5 16,24 10,20.5 10,13.5" fill="oklch(0.78 0.13 220)" opacity="0.55"></polygon></svg>
      <div style="color:white; font-weight:600; font-size:15px; letter-spacing:0.2px;">RepeatScope</div>
    </div>

    <div style="color:oklch(0.6 0.02 260); font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; padding:10px 10px 6px;">Sample</div>
    <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="3">
      <div onClick="{{ item.onClick }}" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; color:oklch(0.85 0.02 260); font-size:13.5px; font-weight:500;" style-hover="background:oklch(0.28 0.05 260);">
        <div style="width:6px; height:6px; border-radius:2px; flex-shrink:0;"></div>
        {{ item.label }}
      </div>
    </sc-for>

    <div style="margin-top:auto; padding:14px 12px; border-radius:10px; background:oklch(0.27 0.05 260);">
      <div style="color:oklch(0.62 0.02 260); font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;">Active sample</div>
      <div style="color:white; font-size:13.5px; font-weight:600; margin-top:4px;">HG-2214-R3</div>
      <div style="color:oklch(0.68 0.03 220); font-size:11.5px; font-family:'IBM Plex Mono'; margin-top:2px;">PacBio HiFi · TRGT v5.1.0</div>
    </div>
  </div>

  <!-- MAIN -->
  <div style="flex:1; display:flex; flex-direction:column; min-width:0;">

    <!-- TOP BAR -->
    <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid oklch(0.9 0.01 90); background:white;">
      <div>
        <div style="font-size:19px; font-weight:600;">{{ screenTitle }}</div>
        <div style="font-size:12.5px; color:oklch(0.5 0.02 260); margin-top:2px;">Sample HG-2214-R3 · Run 2026-06-29 · GRCh38</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="display:flex; align-items:center; gap:8px; padding:8px 14px; border:1px solid oklch(0.88 0.01 90); border-radius:8px; font-size:13px; color:oklch(0.5 0.02 260);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          Search gene or locus
        </div>
        <div style="padding:9px 16px; border-radius:8px; background:oklch(0.5 0.16 220); color:white; font-size:13px; font-weight:600; cursor:pointer;">Export Report</div>
      </div>
    </div>

    <!-- SCREEN BODY -->
    <div style="flex:1; overflow-y:auto;">
      <sc-if value="{{ isOverview }}">
        <dc-import name="OverviewScreen" loci="{{ loci }}" onSelectLocus="{{ goToLocus }}" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{ isLocus }}">
        <dc-import name="LocusDetailScreen" locus="{{ selectedLocusData }}" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{ isQC }}">
        <dc-import name="QCDashboardScreen" hint-size="100%,900px"></dc-import>
      </sc-if>
      <sc-if value="{{ isRunQC }}">
        <dc-import name="GenomeQCScreen" hint-size="100%,1100px"></dc-import>
      </sc-if>
      <sc-if value="{{ isCatalog }}">
        <dc-import name="RepeatCatalogScreen" hint-size="100%,1000px"></dc-import>
      </sc-if>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}}">
class Component extends DCLogic {
  state = { screen: 'overview', selectedLocusId: 'HD_HTT' };

  // Narrative overrides for a handful of loci so the demo tells a clear clinical story.
  // Every other locus (of the 80 in STRchive) gets a plausible benign/rare-intermediate genotype.
  overrides = {
    HD_HTT: { a1:18, a2:44 },
    FXS_FMR1: { a1:29, a2:29 },
    FTDALS1_C9orf72: { a1:2, a2:412 },
    SCA1_ATXN1: { a1:29, a2:37 },
    SCA3_ATXN3: { a1:14, a2:22 },
    DM1_DMPK: { a1:5, a2:5 },
    FRDA_FXN: { a1:580, a2:612 },
    SCA6_CACNA1A: { a1:11, a2:13 },
  };

  seededRand(seed) {
    let s = seed;
    return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  }

  buildLoci() {
    const raw = (typeof window !== 'undefined' && window.STRCHIVE_LOCI) || [];
    return raw.map(l => {
      const rng = this.seededRand(l.id.split('').reduce((a,c)=>a+c.charCodeAt(0),7));
      const bMin = l.benign_min ?? 5, bMax = l.benign_max ?? 30;
      let a1 = Math.round(bMin + rng()*(bMax-bMin));
      let a2 = Math.round(bMin + rng()*(bMax-bMin));
      if (l.intermediate_min != null && rng() < 0.06) {
        const iMax = l.intermediate_max ?? (l.intermediate_min + 5);
        a2 = Math.round(l.intermediate_min + rng()*(iMax-l.intermediate_min));
      }
      const ov = this.overrides[l.id];
      if (ov) { a1 = ov.a1; a2 = ov.a2; }

      const mx = Math.max(a1,a2);
      let status, statusColor, note;
      if (l.pathogenic_min != null && mx >= l.pathogenic_min) {
        status = 'Full expansion'; statusColor = 'oklch(0.55 0.20 25)';
        note = `Above pathogenic threshold (≥${l.pathogenic_min} repeats)`;
      } else if (l.intermediate_min != null && mx >= l.intermediate_min) {
        status = 'Intermediate'; statusColor = 'oklch(0.62 0.15 75)';
        note = `Intermediate allele (${l.intermediate_min}–${l.intermediate_max ?? '?'}); consider follow-up`;
      } else {
        status = 'Normal'; statusColor = 'oklch(0.55 0.14 150)';
        note = `Within benign range (≤${bMax})`;
      }

      return {
        id: l.id, gene: l.gene, disease: l.disease,
        region: `${l.chrom}:${l.start}-${l.stop}`,
        motif: l.motif, a1, a2, status, statusColor,
        zygosity: a1 === a2 ? 'Homozygous' : 'Heterozygous',
        depth: 20 + Math.floor(rng()*26),
        note,
        inheritance: l.inheritance, evidence: l.evidence,
        benign_min: l.benign_min, benign_max: l.benign_max,
        intermediate_min: l.intermediate_min, intermediate_max: l.intermediate_max,
        pathogenic_min: l.pathogenic_min, pathogenic_max: l.pathogenic_max,
      };
    });
  }

  renderVals() {
    if (!this.loci) this.loci = this.buildLoci();
    const goTo = (screen) => () => this.setState({ screen });
    const goToLocus = (id) => this.setState({ screen:'locus', selectedLocusId: id });
    const titles = { overview:'Genome-wide Overview', locus:'Locus Detail', qc:'Sample QC Dashboard', runqc:'Run QC Dashboard', catalog:'Genome-wide Repeat Catalog' };

    return {
      navItems: [
        { label:'Overview', onClick: goTo('overview'), dotStyle: this.state.screen==='overview' ? 'background:oklch(0.78 0.13 220)' : 'background:oklch(0.4 0.02 260)' },
        { label:'Locus Detail', onClick: goTo('locus'), dotStyle: this.state.screen==='locus' ? 'background:oklch(0.78 0.13 220)' : 'background:oklch(0.4 0.02 260)' },
        { label:'Sample QC', onClick: goTo('qc'), dotStyle: this.state.screen==='qc' ? 'background:oklch(0.78 0.13 220)' : 'background:oklch(0.4 0.02 260)' },
        { label:'Run QC', onClick: goTo('runqc'), dotStyle: this.state.screen==='runqc' ? 'background:oklch(0.78 0.13 220)' : 'background:oklch(0.4 0.02 260)' },
        { label:'Repeat Catalog', onClick: goTo('catalog'), dotStyle: this.state.screen==='catalog' ? 'background:oklch(0.78 0.13 220)' : 'background:oklch(0.4 0.02 260)' },
      ],
      screenTitle: titles[this.state.screen],
      isOverview: this.state.screen === 'overview',
      isLocus: this.state.screen === 'locus',
      isQC: this.state.screen === 'qc',
      isRunQC: this.state.screen === 'runqc',
      isCatalog: this.state.screen === 'catalog',
      loci: this.loci,
      goToLocus: goToLocus,
      selectedLocusData: this.loci.find(l => l.id === this.state.selectedLocusId) || this.loci[0],
    };
  }
}

</script>
</body>
</html>
